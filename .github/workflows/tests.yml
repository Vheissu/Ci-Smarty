name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}${{ matrix.framework && format(' / CodeIgniter {0}', matrix.framework) || '' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        framework: ['']
        include:
          # Oldest supported combinations. These framework releases have
          # published advisories, so Composer's insecure-version block is
          # lifted for these jobs only.
          - php: '8.1'
            framework: '4.6.*'
          - php: '8.2'
            framework: '4.5.*'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring
          coverage: none

      - name: Pin CodeIgniter version
        if: matrix.framework != ''
        run: |
          composer config audit.block-insecure false
          composer remove --dev --no-update codeigniter/phpstan-codeigniter phpstan/extension-installer phpstan/phpstan
          composer require --dev --no-update "codeigniter4/framework:${{ matrix.framework }}" "phpunit/phpunit:^10.5"

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run tests
        run: vendor/bin/phpunit

      - name: Run PHPStan
        if: matrix.framework == ''
        run: vendor/bin/phpstan analyse --no-progress
